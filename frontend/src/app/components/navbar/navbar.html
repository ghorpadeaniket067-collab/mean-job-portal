<nav class="navbar">

  <a routerLink="/" class="logo" (click)="closeMenu()">
    <span class="logo-icon">Q</span>

    <span class="logo-text">
      <strong>Job<span>Portal</span></strong>
      <small>YOUR CAREER PARTNER</small>
    </span>
  </a>

  <button
    type="button"
    class="menu-button"
    (click)="toggleMenu()">
    ☰
  </button>

  <div class="nav-links" [class.open]="menuOpen">

    <a
      routerLink="/"
      (click)="closeMenu()">
      Home
    </a>

    <a
      routerLink="/jobs"
      (click)="closeMenu()">
      Jobs
    </a>

    <a
      routerLink="/my-applications"
      (click)="closeMenu()">
      Applications
    </a>

    <a
      routerLink="/profile"
      (click)="closeMenu()">
      Profile
    </a>

    <a
      routerLink="/recruiter-dashboard"
      (click)="closeMenu()">
      Recruiter
    </a>

    <a
      routerLink="/login"
      (click)="closeMenu()">
      Login
    </a>

    <a
      routerLink="/register"
      class="register-btn"
      (click)="closeMenu()">
      Register
    </a>

    @if (userName) {
      <div class="user-menu">

        <img
          src="/images/user-avatar.png"
          alt="User Avatar"
          class="user-avatar"
        />

        <span class="user-name">
          Hi, {{ userName }}
        </span>

        <span class="user-arrow">⌄</span>

      </div>

      <button
        type="button"
        class="logout-btn"
        (click)="logout()">
        Logout
      </button>
    }
  </div>

</nav>
